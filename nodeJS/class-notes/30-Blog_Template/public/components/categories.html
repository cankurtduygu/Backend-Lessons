<div class="nav-scroller py-1 mb-3 border-bottom">
  <nav class="nav nav-underline justify-content-between">
      {% if(categories.length > 0) { %}
      {% categories.forEach(category => { %}
        <a class="nav-item nav-link link-body-emphasis" href="?filter[blogCategoryId]={%= category.id %}">{%= category.name %}</a>
      {% }) %}
      {% } else { %}
      <p style="text-align: center; width: 100%; padding-top: 11px;">No Category Found</p>
      {% } %}
  </nav>
</div>
