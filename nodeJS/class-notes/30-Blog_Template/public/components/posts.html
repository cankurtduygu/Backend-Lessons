{% posts.forEach(post => { %}
  <article class="blog-post">
  <h2 class="display-5 mb-1">
    <a href="/blog/post/{%= post.id %}" class="link-body-emphasis text-decoration-none"
      > {%= post.title %} </a
    >
  </h2>
  <p class="blog-post-meta">{%= post.createdAt.toUTCString().slice(0,15) %}</p>
  <img src="{%= post.imageUrl %}" alt="{%= post.title %}" style="height: 180px; float:left; margin: 0px 15px 15px 0px">
  <p>
    {%= post.content.substring(0, 450) %}
    <a href="/blog/post/{%= post.id %}" class="text-primary text-decoration-none">... read more</a>
  </p>
  
  <div class="admin-area text-end">
    <a class="btn btn-sm btn-primary" href="/blog/post/{%= post.id %}/update">Update</a>
    <a
      class="btn btn-sm btn-danger"
      href="/blog/post/{%= post.id %}/delete"
      onclick="return confirm('Are you sure?');"
      >
        Delete
      </a
    >
  </div>
</article>
{% }) %}
